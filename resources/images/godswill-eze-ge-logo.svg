<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" role="img" aria-labelledby="title desc">
  <title id="title">Godswill Eze GE monogram</title>
  <desc id="desc">Interlocking black G and red E monogram for a web design portfolio.</desc>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3038"/>
      <stop offset="1" stop-color="#e6000b"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25252b"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
  </defs>
  <!-- G: bold open circular form with a forward-cut inner bar -->
  <path fill="url(#black)" d="M232 36c-91-28-183 15-207 99-25 87 26 168 111 179 75 10 137-34 154-103l-68-2c-12 32-42 51-76 45-48-8-74-55-58-101 15-43 63-64 111-48l33-69z"/>
  <path fill="url(#red)" d="M26 157l82-41-63 69c-8 9-17 19-23 30-5-18-4-39 4-58z"/>
  <path fill="#08080b" d="M119 184h137l-30 35H116z"/>
  <!-- E: three aerodynamic red bars, integrated with the G -->
  <path fill="url(#red)" d="M258 34h226c-23 35-57 59-101 72l-110 31h-91l76-103z"/>
  <path fill="url(#red)" d="M254 143h210c-25 33-57 51-99 58l-104 18h-73l66-76z"/>
  <path fill="url(#red)" d="M218 237h235c-29 34-69 55-121 63l-154 0 40-63z"/>
  <!-- subtle black overlap to make the monogram read as one mark -->
  <path fill="#09090c" d="M258 34l-46 64 34 1 45-61z" opacity=".95"/>
</svg>
